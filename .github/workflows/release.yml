name: Desktop releases

on:
  push:
    branches:
      - nightly
    tags:
      - "v*"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build
        required: true
        default: master
        type: string
      channel:
        description: Update channel for the build
        required: true
        default: stable
        type: choice
        options:
          - stable
          - nightly

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    needs: source
    if: needs.source.outputs.verify == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hyperpg_test
          POSTGRES_PASSWORD: hyperpg_test
          POSTGRES_DB: hyperpg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HYPERPG_TEST_DATABASE_URL: postgres://hyperpg_test:hyperpg_test@localhost:5432/hyperpg_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install backend build libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Check frontend and grid behavior
        working-directory: frontend
        run: |
          npm run build
          npm test
          npm run test:e2e
      - name: Check PostgreSQL mutations and transaction rollback
        run: go test -tags server ./...

  source:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      verify: ${{ steps.resolve.outputs.verify }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref || (github.event_name == 'workflow_dispatch' && inputs.source_ref) || 'nightly' }}
          fetch-depth: 0
      - name: Resolve source commit and release channel
        id: resolve
        shell: bash
        env:
          BUILD_CHANNEL: ${{ inputs.channel }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "verify=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "channel=$BUILD_CHANNEL" >> "$GITHUB_OUTPUT"
            if [[ "$BUILD_CHANNEL" == "stable" ]]; then
              echo "version=dev" >> "$GITHUB_OUTPUT"
            else
              echo "version=nightly-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            fi
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "verify=false" >> "$GITHUB_OUTPUT"
          else
            echo "channel=nightly" >> "$GITHUB_OUTPUT"
            echo "version=nightly-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "verify=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [source, verify]
    if: always() && needs.source.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            artifact: release-windows-amd64
          - runner: ubuntu-24.04
            platform: linux
            artifact: release-linux-amd64
    steps:
      - name: Check out the resolved source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28

      - name: Install NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          $nsisDir = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          $makensis = Join-Path $nsisDir 'makensis.exe'
          if (!(Test-Path $makensis)) {
            throw "NSIS was installed, but makensis.exe was not found at $makensis"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir

      - name: Add Go tools to PATH (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value (Join-Path (go env GOPATH) 'bin')

      - name: Add Go tools to PATH (Linux)
        if: matrix.platform == 'linux'
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set application version (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.source.outputs.version }}
        run: Set-Content -Path VERSION -Value $env:APP_VERSION -Encoding utf8NoBOM -NoNewline

      - name: Set application version (Linux)
        if: matrix.platform == 'linux'
        env:
          APP_VERSION: ${{ needs.source.outputs.version }}
        run: printf '%s' "$APP_VERSION" > VERSION

      - name: Build Linux application
        if: matrix.platform == 'linux'
        run: wails3 build

      - name: Package Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.source.outputs.version }}
        run: |
          if ($env:APP_VERSION -match '^v?(\d+)\.(\d+)\.(\d+)$') {
            $installerVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          } else {
            $installerVersion = "0.0.$env:GITHUB_RUN_NUMBER"
          }
          wails3 task windows:package ARCH=amd64 INSTALL_SCOPE=user PRODUCT_VERSION=$installerVersion
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item bin\hyperpg-amd64-installer.exe release\hyperpg-windows-amd64-setup.exe

      - name: Package Linux executable
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release
          cp bin/hyperpg release/hyperpg
          tar -C release -czf release/hyperpg-linux-amd64.tar.gz hyperpg
          rm release/hyperpg

      - name: Upload build asset
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: [source, build]
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0

      - name: Download platform builds
        uses: actions/download-artifact@v6
        with:
          path: release
          merge-multiple: true

      - name: Require stable tags to point into master
        if: needs.source.outputs.channel == 'stable'
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          git fetch origin master --no-tags
          if ! git merge-base --is-ancestor "$SOURCE_SHA" FETCH_HEAD; then
            echo "Stable release tags must point to a commit on master." >&2
            exit 1
          fi

      - name: Prepare stable release notes from the changelog
        if: needs.source.outputs.channel == 'stable'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          python3 - "$version" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          heading = re.compile(rf"^## \[{re.escape(version)}\](?:\s+-\s+\d{{4}}-\d{{2}}-\d{{2}})?\s*$")
          start = next((index for index, line in enumerate(lines) if heading.match(line)), None)
          if start is None:
              raise SystemExit(f"Add a dated CHANGELOG.md section for [{version}] before tagging this release.")

          end = next((index for index in range(start + 1, len(lines)) if lines[index].startswith("## ")), len(lines))
          notes = "\n".join(lines[start + 1:end]).strip()
          if not notes:
              raise SystemExit(f"The CHANGELOG.md section for [{version}] is empty.")
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Create stable GitHub release
        if: needs.source.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md

      - name: Prepare nightly release notes
        if: needs.source.outputs.channel == 'nightly'
        id: nightly
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          short_sha="${SOURCE_SHA:0:7}"
          title="Nightly $(date -u +'%Y-%m-%d') ($short_sha)"
          tag="nightly-${GITHUB_RUN_NUMBER}-${short_sha}-attempt-${GITHUB_RUN_ATTEMPT}"
          {
            echo "Automated prerelease built from the \`nightly\` branch."
            echo
            echo "Commit: \`$SOURCE_SHA\`"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > nightly-notes.md
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create nightly prerelease
        if: needs.source.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ steps.nightly.outputs.tag }}
          NIGHTLY_TITLE: ${{ steps.nightly.outputs.title }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: gh release create "$NIGHTLY_TAG" release/* --target "$SOURCE_SHA" --prerelease --title "$NIGHTLY_TITLE" --notes-file nightly-notes.md
